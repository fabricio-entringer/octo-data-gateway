<!-- user_form.html — create/edit modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" id="user-form-modal"
     onclick="if(event.target===this) this.remove()">
  <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-lg mx-4" onclick="event.stopPropagation()">
    <h3 class="text-lg font-semibold mb-4">
      {% if user %}Edit User — {{ user.name }}{% else %}New User{% endif %}
    </h3>

    <form {% if user %}
            hx-put="/admin/users/{{ user.user_id }}"
          {% else %}
            hx-post="/admin/users"
          {% endif %}
          hx-target="#user-table-body" hx-swap="innerHTML"
          hx-on::after-request="document.getElementById('user-form-modal')?.remove()">

      <div class="space-y-4">
        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Name <span class="text-red-500">*</span></label>
          <input type="text" name="name" value="{{ user.name if user else '' }}" required
                 class="w-full rounded-lg border px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 focus:outline-none" />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" value="{{ user.email if user and user.email else '' }}"
                 class="w-full rounded-lg border px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 focus:outline-none" />
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea name="description" rows="2"
                    class="w-full rounded-lg border px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 focus:outline-none">{{ user.description if user and user.description else '' }}</textarea>
        </div>

        <!-- Scopes -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Scopes</label>
          <div class="flex flex-wrap gap-3">
            {% for scope in all_scopes %}
            <label class="inline-flex items-center gap-1.5 text-sm">
              <input type="checkbox" name="scopes" value="{{ scope }}"
                     {% if user and scope in user.scopes %}checked{% endif %}
                     class="rounded border-gray-300 text-sky-600 focus:ring-sky-400" />
              {{ scope }}
            </label>
            {% endfor %}
          </div>
        </div>

        <!-- API Key Expiration -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">API Key Expiration</label>
          <input type="datetime-local" name="api_key_expires_at"
                 value="{{ user.api_key_expires_at.strftime('%Y-%m-%dT%H:%M') if user and user.api_key_expires_at else '' }}"
                 class="w-full rounded-lg border px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 focus:outline-none" />
          <p class="text-xs text-gray-400 mt-1">Leave empty for no expiration</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-2 mt-6">
        <button type="button" onclick="document.getElementById('user-form-modal').remove()"
                class="px-4 py-2 text-sm rounded-lg border hover:bg-gray-50">Cancel</button>
        <button type="submit"
                class="px-4 py-2 text-sm rounded-lg bg-sky-600 text-white hover:bg-sky-700">
          {% if user %}Update User{% else %}Create User{% endif %}
        </button>
      </div>
    </form>
  </div>
</div>

<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Dashboard{% endblock %} — Octo Data Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/admin/static/css/admin.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sidebar: '#1e293b',
            'sidebar-hover': '#334155',
            'sidebar-active': '#0ea5e9',
            ocean: { light: '#0ea5e9', DEFAULT: '#0284c7', dark: '#0369a1' },
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-gray-50 text-gray-900">
  <div class="flex h-full" id="app-layout">

    <!-- Mobile overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 z-30 bg-black/40 hidden lg:hidden" onclick="toggleSidebar()"></div>

    {% include "partials/sidebar.html" %}

    <!-- Main content -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Top bar -->
      <header class="sticky top-0 z-10 flex items-center gap-4 border-b bg-white px-4 py-3 shadow-sm sm:px-6">
        <button class="lg:hidden -ml-2 p-2 rounded-md hover:bg-gray-100" onclick="toggleSidebar()" aria-label="Toggle sidebar">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <h1 class="text-lg font-semibold text-gray-800">{% block page_title %}Dashboard{% endblock %}</h1>
      </header>

      <!-- Page content -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="/admin/static/js/admin.js"></script>
</body>
</html>

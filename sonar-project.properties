# SonarCloud Configuration
sonar.organization=fabricio-entringer
sonar.projectKey=fabricio-entringer_octo-data-gateway
sonar.projectName=Octo Data Gateway
sonar.projectVersion=0.0.1

# Source code settings
sonar.sources=app,run.py
sonar.tests=tests
sonar.language=py

# Python-specific settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,logs/**,data/**,assets/**,.venv/**
sonar.test.exclusions=tests/**

# Coverage exclusions
sonar.coverage.exclusions=tests/**,**/__init__.py,run.py

# Analysis parameters
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
name: 📋 Task
description: Create a task for REST API project work or maintenance
labels: ["task", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Please provide details below to help us track and complete this REST API task.

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: Clearly describe what needs to be done.
      placeholder: This task involves...
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: API Endpoint (if applicable)
      description: The REST API endpoint affected by this task (e.g. /users, /data)
      placeholder: /your/endpoint

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this task?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define what needs to be completed for this task to be considered done.
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have clearly described the task
          required: true
        - label: I have defined clear acceptance criteria
          required: true
        - label: I have checked for existing related issues
          required: true
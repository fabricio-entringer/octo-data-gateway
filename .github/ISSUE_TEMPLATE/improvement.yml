name: 🚀 Feature Request / Improvement
description: Suggest an idea or improvement for the REST API
labels: ["enhancement", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Please provide details below to help us understand your REST API improvement request.

  - type: input
    id: endpoint
    attributes:
      label: API Endpoint
      description: The REST API endpoint you want to improve or add (e.g. /users, /data)
      placeholder: /your/endpoint
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: Improvement Description
      description: Describe the feature or improvement you are requesting.
      placeholder: What would you like to see changed or added?
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: How would this improvement be used and who would benefit?
      placeholder: This would help users who...
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this improvement to you?
      options:
        - Low - Nice to have
        - Medium - Would be helpful
        - High - Important for my use case
        - Critical - Blocking my work
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched for existing issues
          required: true
        - label: I have provided all the requested information
          required: true
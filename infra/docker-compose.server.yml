version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - octo-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  app:
    image: entringer/octo-data-gateway:latest
    restart: unless-stopped
    networks:
      - octo-network
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

networks:
  octo-network:
    driver: bridge

volumes:
  redis-data:
